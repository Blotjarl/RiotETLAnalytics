name: Backfill Rich Participant Fields

on:
  workflow_dispatch:
    inputs:
      batch_limit:
        description: 'Max matches to backfill in this run (bounded by Riot rate limit)'
        required: false
        default: '8000'

concurrency:
  group: riot-api-etl
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKFILL_BATCH_LIMIT: ${{ github.event.inputs.batch_limit }}
          PYTHONUNBUFFERED: '1'
        run: python -m etl.backfill
